[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netforge"
version = "0.1.0"
description = "NetForge - Network Operations Toolkit"
authors = [
    { name = "Priyanshu Agarwal" }
]
requires-python = ">=3.10"

dependencies = [
    "PySide6",
    "SQLAlchemy",
    "loguru",
    "pydantic",
    "pyqtdarktheme",
    "paramiko",
    "pyte",
    "cryptography",
    "dnspython"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]